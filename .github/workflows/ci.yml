name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: .NET tests
        run: dotnet test NoMansForest.slnx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tools tests
        run: |
          pip install pillow numpy
          python -m unittest discover -s tools/mapgen/tests -t .
          python -m unittest discover -s tools/art/tests -t .
