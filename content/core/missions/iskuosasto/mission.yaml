# The first mission (main spec §11), small first cut: one Finnish section against a Soviet reconnaissance party.
id: iskuosasto
title: { en: "Strike Detachment", fi: "Iskuosasto" }
date: { en: "Lake Onega shore south of Karhumäki, 14 July 1942, 03:10 — the nightless night", fi: "Äänisen ranta Karhumäen eteläpuolella, 14.7.1942 klo 3.10 — yötön yö" }
map: karhumaki
start: "1942-07-14 03:10"   # sunrise on Lake Onega in mid-July is about three o'clock
briefing: { en: briefing.en.md, fi: briefing.fi.md }

squads:
  strike:  { en: "Strike squad", fi: "Iskuryhmä" }
  support: { en: "Support squad", fi: "Tukiryhmä" }
  post:    { en: "Knoll post", fi: "Kumpareen asema" }
  reserve: { en: "Reserve", fi: "Reservi" }

forces:
  player:   # the boys of the strike detachment: picked volunteers, hard to shake, veterans of the Winter War
    - { name: "Alik. Korpela", squad: strike, weapon: suomi_kp31, grenade: m32, leader: true, nerve: 95, morale: 950, marksmanship: 70, leadership: 90, experience: 90 }
    - { name: "Sotm. Mäkinen", squad: strike, weapon: mosin_m39, grenade: m32, nerve: 80, morale: 880, marksmanship: 90, experience: 80 }
    - { name: "Sotm. Laine", squad: strike, weapon: mosin_m39, grenade: m32, nerve: 90, morale: 900, marksmanship: 60, experience: 75 }
    - { name: "Sotm. Hakala", squad: strike, weapon: suomi_kp31, grenade: m32, nerve: 85, morale: 880, marksmanship: 60, experience: 75 }
    - { name: "Kpl. Virtanen", squad: support, weapon: lahti_saloranta, grenade: m32, leader: true, nerve: 85, morale: 900, marksmanship: 75, leadership: 80, experience: 85 }
    - { name: "Sotm. Nieminen", squad: support, weapon: mosin_m39, grenade: m32, nerve: 80, morale: 860, marksmanship: 65, experience: 70 }
    - { name: "Sotm. Rantanen", squad: support, weapon: mosin_m39, grenade: m32, nerve: 80, morale: 860, marksmanship: 70, experience: 70 }
  enemy:    # an ordinary reconnaissance party, far from home: a post on the knoll and a reserve behind it
    - { name: "Serž. Belov", squad: post, weapon: ppsh41, grenade: rgd33, leader: true, nerve: 75, morale: 800, marksmanship: 55, leadership: 70, experience: 60, items: [soviet_orders] }
    - { name: "Efr. Kuznetsov", squad: post, weapon: dp27, grenade: rgd33, nerve: 55, morale: 720, marksmanship: 60, experience: 50 }
    - { name: "Kr-ts Orlov", squad: post, weapon: mosin_9130, grenade: rgd33, nerve: 40, morale: 650, marksmanship: 50, experience: 30 }
    - { name: "Kr-ts Sidorenko", squad: post, weapon: mosin_9130, grenade: rgd33, nerve: 65, morale: 700, marksmanship: 55, experience: 45 }
    - { name: "Kr-ts Gusev", squad: post, weapon: mosin_9130, grenade: rgd33, nerve: 50, morale: 680, marksmanship: 45, experience: 35 }
    - { name: "Ml. serž. Petrov", squad: reserve, weapon: ppsh41, grenade: rgd33, leader: true, nerve: 70, morale: 760, marksmanship: 55, leadership: 60, experience: 55 }
    - { name: "Kr-ts Volkov", squad: reserve, weapon: mosin_9130, grenade: rgd33, nerve: 55, morale: 700, marksmanship: 50, experience: 40 }
    - { name: "Kr-ts Smirnov", squad: reserve, weapon: mosin_9130, grenade: rgd33, nerve: 50, morale: 680, marksmanship: 50, experience: 35 }
    - { name: "Kr-ts Ivanov", squad: reserve, weapon: mosin_9130, grenade: rgd33, nerve: 60, morale: 700, marksmanship: 45, experience: 40 }

objectives:
  - id: grab_orders
    type: pick_up
    item: soviet_orders
    text: { en: "Take the orders from the Soviet party leader", fi: "Ota neuvostopartion johtajan käskyt" }
  - id: bring_back
    type: reach_zone
    zone: start_zone
    carrying: soviet_orders
    requires: [grab_orders]
    text: { en: "Bring the orders back to the start area", fi: "Tuo käskyt lähtöalueelle" }

# An active party: it sends men to look where it hears shots, and counterattacks when the odds turn its way.
enemy_ai: { counterattack: true, investigate: true }

items:
  soviet_orders: { en: "Soviet orders", fi: "Neuvostopartion käskyt" }

# Drawn on the mission map: up through the spruce west of the bog, in on the knoll from the south-west; back the same way.
plan:
  - { kind: attack, points: [[252, 812], [300, 740], [352, 668], [410, 604], [452, 568]] }
  - { kind: withdraw, points: [[462, 574], [420, 640], [352, 720], [262, 808]] }
