  - { name: "Alik. Korpela",   nerve: 95, morale: 950, marksmanship: 70, leadership: 90, experience: 90 }
  - { name: "Kpl. Virtanen",   nerve: 85, morale: 900, marksmanship: 75, leadership: 80, experience: 85 }
  - { name: "Alik. Kauppinen", nerve: 85, morale: 900, marksmanship: 75, leadership: 65, experience: 80 }
  - { name: "Sotm. Mäkinen",   nerve: 80, morale: 880, marksmanship: 90, leadership: 40, experience: 80 }
  - { name: "Sotm. Laine",     nerve: 90, morale: 900, marksmanship: 60, leadership: 45, experience: 75 }
  - { name: "Sotm. Hakala",    nerve: 85, morale: 880, marksmanship: 60, leadership: 40, experience: 75 }
  - { name: "Sotm. Nieminen",  nerve: 80, morale: 860, marksmanship: 65, leadership: 35, experience: 70 }
  - { name: "Sotm. Rantanen",  nerve: 80, morale: 860, marksmanship: 70, leadership: 35, experience: 70 }
  - { name: "Sotm. Aho",       nerve: 85, morale: 880, marksmanship: 60, leadership: 30, experience: 70 }
