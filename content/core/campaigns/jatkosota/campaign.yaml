chapters:
  - mission: iskuosasto
    before:
      en: |
        A Soviet reconnaissance party has dug in on a knoll in front of our line. Lehto picks Korpela's strike squad
        and Virtanen's light machine gun to take it in the light of the nightless night; the rest of the platoon
        stays in the line.
      fi: |
        Neuvostoliittolainen tiedustelupartio on kaivautunut kumpareelle linjamme eteen. Lehto valitsee Korpelan
        iskuryhmän ja Virtasen pikakiväärin viemään sen yöttömän yön valossa; muu joukkue jää linjaan.
    after:
      en: |
        The knoll is ours and the party's orders are at battalion. Autumn comes, then the frost. In December the
        platoon is moved north to Povenets, where the White Sea Canal is the front line.
      fi: |
        Kumpare on meidän ja partion käskyt pataljoonassa. Tulee syksy ja sitten pakkaset. Joulukuussa joukkue
        siirretään pohjoiseen Poventsaan, jossa Vienan kanava on etulinja.
  - mission: hylky
    before:
      en: |
        January 1943, east of Povenets. A reconnaissance plane has come down behind the canal; the pilot is alive.
        Lehto takes a ski patrol of his best men across the ice at dusk. A Soviet search party is already out.
      fi: |
        Tammikuu 1943, Poventsan itäpuoli. Tiedustelukone on pudonnut kanavan taakse, ja lentäjä elää. Lehto vie
        parhaista miehistään kootun hiihtopartion jään yli iltahämärissä. Neuvostoliittolainen etsintäpartio on jo
        liikkeellä.
    after:
      en: |
        The pilot and his map case are back over the canal. Lehto's platoon has done what was asked of it; what the
        spring brings is another story.
      fi: |
        Lentäjä ja hänen karttalaukkunsa ovat taas kanavan tällä puolen. Lehdon joukkue on tehnyt sen, mitä siltä
        pyydettiin; mitä kevät tuo tullessaan, on toinen tarina.
