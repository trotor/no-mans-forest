# The first campaign (spec docs/superpowers/specs/2026-10-11-campaign-design.md): Sergeant Lehto's platoon from the
# Karhumäki front in the summer of 1942 to the canal in the winter of 1943. The men live on from mission to mission;
# a mission's own men take their own slots, the others fill in by leadership and experience.
id: jatkosota
title: { en: "Lehto's Platoon", fi: "Lehdon joukkue" }
intro:
  en: |
    Summer 1942. The front has stood still on the Svir and at Karhumäki since the winter. Sergeant Lehto's platoon
    holds a stretch of the Lake Onega shore south of Karhumäki: men from the same villages, most of them through the
    Winter War already. Positional war means patrols, strikes and long nights, and every man lost is one the
    platoon will miss.
  fi: |
    Kesä 1942. Rintama on seissyt Syvärillä ja Karhumäessä talvesta asti. Kersantti Lehdon joukkue pitää Äänisen
    rantaa Karhumäen eteläpuolella: saman pitäjän miehiä, useimmat käyneet jo talvisodan. Asemasota on partioita,
    iskuja ja pitkiä öitä, ja jokainen menetetty mies on joukkueelta pois.
