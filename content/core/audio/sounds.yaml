  shot.rifle: { bus: sfx, files: [sfx/shot.rifle.1.ogg, sfx/shot.rifle.2.ogg, sfx/shot.rifle.3.ogg, sfx/shot.rifle.4.ogg], priority: 70, loud: true }
  shot.smg: { bus: sfx, files: [sfx/shot.smg.1.ogg, sfx/shot.smg.2.ogg, sfx/shot.smg.3.ogg], priority: 70, loud: true }
